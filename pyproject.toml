[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-journal-agent"
version = "0.1.0"
description = "Decision journal and calibration helper"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
decision-journal = "decision_journal_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
